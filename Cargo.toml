[package]
name = "fnf-price-engine"
version = "0.1.0"
edition = "2021"
description = "USD pricing for FNF Wallet: price fetching, id resolution and base-unit valuation (no keys, no signing)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Public price feed. Both consumers (the Tauri app and fnf-history) already
# depend on reqwest with these exact features, so this adds no new build cost.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Chain + token metadata. Price ids come from here rather than being
# hardcoded, so adding a chain never means editing this crate.
fnf-registry = { version = "0.1.0", path = "../registry" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }